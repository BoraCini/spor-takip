name: Paketli ürün verisi

# Open Food Facts dökümünden Türkiye'de satılan paketli ürün listesini (public/data/off_tr.json) yeniler.
# Haftalık çalışır; ürünler değiştiyse testleri geçirip kaydeder (main'e kayıt otomatik yayın demektir).
on:
  schedule:
    - cron: '23 2 * * 1' # pazartesi 05:23 (TSİ)
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - scripts/build-off-tr.mjs
      - .github/workflows/off-data.yml

permissions:
  contents: write

concurrency:
  group: off-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ürün listesini üret
        run: node scripts/build-off-tr.mjs
      - name: Birim testleri
        run: npx vitest run
      - name: Değiştiyse kaydet
        run: |
          git add -N public/data/off_tr.json
          if git diff --quiet -- public/data/off_tr.json; then echo "Değişiklik yok"; exit 0; fi
          git config user.name "procoach-veri"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/off_tr.json
          git commit -m "Paketli ürün verisi: $(node -p "require('./public/data/off_tr.json').count") ürün ($(date -u +%F))"
          git push
